<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Waste Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f1f8f2;
            color: #23452b;
            text-align: center;
        }
        header {
            background: #218838;
            color: white;
            padding: 25px;
        }
        main {
            padding: 40px 20px;
        }
        button {
            background: #218838;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        section {
            background: white;
            margin: 20px auto;
            padding: 25px;
            max-width: 600px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Food Waste Management</h1>
        <p>Save Food, Feed People, Protect Our Planet</p>
    </header>

    <main>
        <section>
            <h2>Welcome!</h2>
            <p>Help reduce food waste by sharing surplus food
            with people who need it.</p>
            <button onclick="alert('Thank you for helping reduce food waste!')">
                Get Started
            </button>
        </section>

        <section>
            <h2>Our Mission</h2>
            <p>Collect excess food, reduce waste, and support
            communities through food donation.</p>
        </section>
    </main>
</body>
</html>
